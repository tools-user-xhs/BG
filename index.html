<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>出口报关单生成器 · 高级工具</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f0f3f7;
            padding: 32px 24px;
            color: #1e293b;
            line-height: 1.4;
        }
        .app-container { max-width: 1400px; margin: 0 auto; }
        .tool-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }
        .title-section h1 {
            font-weight: 600;
            font-size: 1.9rem;
            letter-spacing: -0.02em;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .title-section h1 i { color: #2563eb; font-size: 1.8rem; }
        .title-section .sub {
            font-size: 0.9rem;
            font-weight: 400;
            color: #64748b;
            margin-top: 6px;
        }
        .import-area {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }
        .import-btn, .template-btn {
            background: white;
            border: 1px solid #e2e8f0;
            padding: 10px 20px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1e293b;
            box-shadow: 0 4px 8px rgba(0,0,0,0.02);
            transition: all 0.2s;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
            background: rgba(255,255,255,0.8);
        }
        .template-btn { background: #f8fafc; border-color: #cbd5e1; }
        .template-btn i { color: #2563eb; }
        .import-btn:hover, .template-btn:hover {
            background: white;
            border-color: #2563eb;
            box-shadow: 0 8px 16px rgba(37,99,235,0.08);
        }
        .file-name { font-size: 0.9rem; color: #475569; }
        .param-panel {
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.6);
            border-radius: 28px;
            padding: 28px 28px 20px;
            box-shadow: 0 20px 40px -12px rgba(0,0,0,0.1), 0 4px 18px rgba(0,0,0,0.02);
            margin-bottom: 32px;
        }
        .param-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px 24px;
        }
        .input-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-field label {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .input-field label i { font-size: 0.75rem; color: #94a3b8; }
        .input-field input, .input-field select {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            color: #0f172a;
            transition: border 0.15s, box-shadow 0.15s;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.01);
        }
        .input-field input:focus, .input-field select:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
        }
        .input-field input::placeholder { color: #a0afbe; font-weight: 300; font-size: 0.9rem; }
        .product-section {
            margin-top: 24px;
            border-top: 1px dashed #cbd5e1;
            padding-top: 22px;
        }
        .section-label {
            font-weight: 600;
            font-size: 1rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #1e293b;
        }
        .product-row {
            display: grid;
            grid-template-columns: 1.2fr 2fr 1fr 1fr 1fr 1.2fr 0.8fr;
            gap: 12px;
            align-items: end;
        }
        .action-bar {
            display: flex;
            justify-content: flex-end;
            margin-top: 28px;
            gap: 16px;
        }
        .btn-generate {
            background: #0f172a;
            color: white;
            border: none;
            padding: 14px 38px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            letter-spacing: 0.3px;
            box-shadow: 0 12px 24px -8px rgba(15,23,42,0.2);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-generate:hover {
            background: #1e293b;
            transform: translateY(-1px);
            box-shadow: 0 20px 28px -10px #0f172a80;
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid #cbd5e1;
            padding: 14px 24px;
            border-radius: 60px;
            font-weight: 500;
            color: #334155;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-secondary:hover { background: white; border-color: #94a3b8; }

        /* 预览区容器相对定位，用于放置右下角按钮 */
        .preview-wrapper {
            position: relative;
        }
        .declaration-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 30px 50px -20px rgba(0,0,0,0.15), 0 0 0 1px rgba(0,0,0,0.02);
            padding: 24px 28px 32px;
            transition: all 0.2s;
        }
        .print-corner-btn {
            position: absolute;
            bottom: 20px;
            right: 28px;
            background: #0f172a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 500;
            font-size: 0.95rem;
            box-shadow: 0 8px 18px rgba(15,23,42,0.25);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 5;
        }
        .print-corner-btn:hover {
            background: #1e293b;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }
        .print-corner-btn i { font-size: 1rem; }

        .declaration-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px solid #0f172a;
            padding-bottom: 12px;
            margin-bottom: 18px;
        }
        .declaration-title h2 {
            font-weight: 700;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: #0b1c2e;
        }
        .pre-entry-no {
            font-family: 'Inter', monospace;
            font-weight: 500;
            background: #f1f5f9;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.95rem;
        }
        .custom-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        .custom-table td, .custom-table th {
            border: 1px solid #dce3ec;
            padding: 12px 12px;
            vertical-align: top;
            background-color: white;
        }
        .custom-table .label {
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            color: #64748b;
            letter-spacing: 0.2px;
            margin-bottom: 4px;
        }
        .custom-table .value { font-weight: 500; color: #0f172a; word-break: break-word; }
        .goods-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 0.85rem;
        }
        .goods-table th {
            background: #f8fafc;
            padding: 12px 8px;
            font-weight: 600;
            color: #1e293b;
            border: 1px solid #dce3ec;
            text-align: left;
        }
        .goods-table td { border: 1px solid #dce3ec; padding: 10px 8px; background: white; }
        .remarks {
            margin-top: 16px;
            padding: 12px 16px;
            background: #f9fbfd;
            border-radius: 16px;
            border: 1px solid #e9edf2;
            font-size: 0.9rem;
        }
        .footer-note {
            color: #62748c;
            font-size: 0.8rem;
            margin-top: 16px;
            text-align: right;
        }
        .sample-tip {
            background: #eef2ff;
            border-radius: 20px;
            padding: 8px 18px;
            color: #2563eb;
            font-size: 0.8rem;
            font-weight: 500;
        }
        .file-input-hidden { display: none; }
        @media print {
            body { background: white; padding: 0.2in; }
            .tool-header, .param-panel, .footer-note, .import-area, .action-bar, .btn-generate, .btn-secondary, .import-btn, .template-btn, .print-corner-btn {
                display: none !important;
            }
            .preview-wrapper { position: static; }
            .declaration-card {
                box-shadow: none;
                border-radius: 0;
                padding: 0;
                background: white;
                page-break-inside: avoid;
            }
            .custom-table td, .custom-table th, .goods-table td, .goods-table th {
                border-color: #000 !important;
                background: white !important;
                color: black !important;
            }
            .declaration-title { border-bottom-color: #000; }
            .remarks { background: white; border: 1px solid #000; border-radius: 0; }
            .pre-entry-no { background: none; border: 1px solid #000; }
        }
    </style>
</head>
<body>
<div class="app-container">
    <!-- 数据列表 (datalist) 用于可选项 -->
    <datalist id="tradeCountryList">
        <option value="中国">中国</option><option value="美国">美国</option><option value="日本">日本</option><option value="德国">德国</option><option value="英国">英国</option><option value="澳大利亚">澳大利亚</option><option value="韩国">韩国</option><option value="越南">越南</option><option value="印度">印度</option><option value="巴西">巴西</option><option value="加拿大">加拿大</option><option value="法国">法国</option><option value="意大利">意大利</option><option value="俄罗斯">俄罗斯</option><option value="新加坡">新加坡</option><option value="马来西亚">马来西亚</option><option value="泰国">泰国</option><option value="印度尼西亚">印度尼西亚</option><option value="墨西哥">墨西哥</option>
    </datalist>
    <datalist id="destinationCountryList">
        <option value="美国">美国</option><option value="日本">日本</option><option value="德国">德国</option><option value="英国">英国</option><option value="澳大利亚">澳大利亚</option><option value="韩国">韩国</option><option value="越南">越南</option><option value="印度">印度</option><option value="巴西">巴西</option><option value="加拿大">加拿大</option><option value="法国">法国</option><option value="意大利">意大利</option><option value="荷兰">荷兰</option><option value="阿联酋">阿联酋</option><option value="沙特阿拉伯">沙特阿拉伯</option><option value="南非">南非</option>
    </datalist>
    <datalist id="portDestList">
        <option value="洛杉矶">洛杉矶</option><option value="长滩">长滩</option><option value="纽约">纽约</option><option value="鹿特丹">鹿特丹</option><option value="汉堡">汉堡</option><option value="新加坡">新加坡</option><option value="香港">香港</option><option value="上海">上海</option><option value="深圳">深圳</option><option value="釜山">釜山</option><option value="东京">东京</option><option value="横滨">横滨</option><option value="悉尼">悉尼</option><option value="墨尔本">墨尔本</option><option value="温哥华">温哥华</option><option value="巴生港">巴生港</option><option value="丹戎帕拉帕斯">丹戎帕拉帕斯</option><option value="科伦坡">科伦坡</option><option value="迪拜">迪拜</option><option value="安特卫普">安特卫普</option>
    </datalist>
    <datalist id="portExitList">
        <option value="上海洋山">上海洋山</option><option value="上海外高桥">上海外高桥</option><option value="宁波舟山">宁波舟山</option><option value="深圳盐田">深圳盐田</option><option value="深圳蛇口">深圳蛇口</option><option value="青岛">青岛</option><option value="天津新港">天津新港</option><option value="大连">大连</option><option value="厦门">厦门</option><option value="广州南沙">广州南沙</option><option value="连云港">连云港</option><option value="苏州">苏州(内河)</option><option value="重庆">重庆(内河)</option><option value="武汉">武汉(内河)</option>
    </datalist>

    <div class="tool-header">
        <div class="title-section">
            <h1><i class="fas fa-file-invoice"></i> 出口报关单生成器</h1>
            <div class="sub">智能参数 · 一键生成 · 符合视觉习惯</div>
        </div>
        <div class="import-area">
            <span class="sample-tip"><i class="far fa-file-alt"></i> 支持TXT模板</span>
            <button class="template-btn" id="downloadTemplateBtn"><i class="fas fa-download"></i> 下载TXT模板</button>
            <button class="import-btn" id="importBtn"><i class="fas fa-upload"></i> 导入TXT</button>
            <span id="fileNameDisplay" class="file-name"></span>
            <input type="file" id="txtFileInput" accept=".txt,text/plain" class="file-input-hidden">
        </div>
    </div>

    <!-- 输入面板 -->
    <div class="param-panel">
        <div class="param-grid">
            <div class="input-field"><label><i class="fas fa-user"></i> 境内发货人</label><input type="text" id="consignor" placeholder="例: 上海XX进出口有限公司" value="上海源盛国际贸易有限公司"></div>
            <div class="input-field"><label><i class="fas fa-globe"></i> 境外收货人</label><input type="text" id="consignee" placeholder="例: ABC TRADING CO.,LTD" value="SUNRISE IMPORTS LLC"></div>
            <div class="input-field"><label><i class="fas fa-building"></i> 生产销售单位</label><input type="text" id="manufacturer" placeholder="生产销售单位" value="苏州精密制造厂"></div>
            <div class="input-field"><label><i class="fas fa-file-signature"></i> 合同协议号</label><input type="text" id="contractNo" placeholder="合同号/PI号" value="SC20260408-01"></div>
            <div class="input-field"><label><i class="fas fa-ship"></i> 运输方式</label><select id="transportMode"><option value="水路运输" selected>水路运输</option><option value="航空运输">航空运输</option><option value="铁路运输">铁路运输</option><option value="公路运输">公路运输</option></select></div>
            <div class="input-field"><label><i class="fas fa-anchor"></i> 运输工具名称</label><input type="text" id="vesselVoyage" placeholder="船名/航次" value="EVER FORTUNE / 2406W"></div>
            <div class="input-field"><label><i class="fas fa-ticket"></i> 提运单号</label><input type="text" id="billNo" placeholder="B/L No." value="EGLV149400528888"></div>
            <div class="input-field"><label><i class="fas fa-tags"></i> 监管方式</label><input type="text" id="supervisionMode" value="一般贸易" placeholder="一般贸易"></div>
            <div class="input-field"><label><i class="fas fa-shield"></i> 征免性质</label><input type="text" id="exemptionNature" value="一般征税" placeholder="一般征税"></div>
            <div class="input-field"><label><i class="fas fa-passport"></i> 许可证号</label><input type="text" id="licenseNo" placeholder="(可选)"></div>
            <div class="input-field"><label><i class="fas fa-flag"></i> 贸易国(地区)</label><input type="text" id="tradeCountry" list="tradeCountryList" value="美国" placeholder="输入或选择"></div>
            <div class="input-field"><label><i class="fas fa-location-dot"></i> 运抵国(地区)</label><input type="text" id="destinationCountry" list="destinationCountryList" value="美国" placeholder="输入或选择"></div>
            <div class="input-field"><label><i class="fas fa-map-pin"></i> 指运港</label><input type="text" id="portOfDestination" list="portDestList" value="洛杉矶" placeholder="输入或选择"></div>
            <div class="input-field"><label><i class="fas fa-plane-departure"></i> 离境口岸</label><input type="text" id="portOfExit" list="portExitList" value="上海洋山" placeholder="输入或选择"></div>
            <div class="input-field"><label><i class="fas fa-weight-hanging"></i> 成交方式</label><select id="tradeTerm"><option value="FOB" selected>FOB</option><option value="CIF">CIF</option><option value="CFR">CFR</option><option value="EXW">EXW</option></select></div>
            <div class="input-field"><label><i class="fas fa-box"></i> 件数</label><input type="text" id="packageQty" value="320 CTNS"></div>
            <div class="input-field"><label><i class="fas fa-weight-scale"></i> 毛重(KG)</label><input type="text" id="grossWeight" value="8520.5"></div>
            <div class="input-field"><label><i class="fas fa-weight-hanging"></i> 净重(KG)</label><input type="text" id="netWeight" value="7800.0"></div>
            <div class="input-field"><label><i class="fas fa-cube"></i> 包装种类</label><input type="text" id="packageType" value="纸箱"></div>
            <div class="input-field"><label><i class="fas fa-dollar-sign"></i> 运费</label><input type="text" id="freight" placeholder="USD 1200" value="1200"></div>
            <div class="input-field"><label><i class="fas fa-shield-halved"></i> 保费</label><input type="text" id="insurance" placeholder="USD 80" value="80"></div>
        </div>

        <div class="product-section">
            <div class="section-label"><i class="fas fa-barcode"></i> 主要商品信息 (HS编码/规格)</div>
            <div class="product-row">
                <div class="input-field"><label>HS编码</label><input type="text" id="hsCode" value="9503008900" placeholder="9503008900"></div>
                <div class="input-field"><label>商品名称及规格</label><input type="text" id="goodsDesc" value="电动遥控玩具车 1:16" placeholder="品名/规格"></div>
                <div class="input-field"><label>数量</label><input type="text" id="quantity" value="1500" placeholder="1500"></div>
                <div class="input-field"><label>单位</label><input type="text" id="unit" value="个" placeholder="个/套"></div>
                <div class="input-field"><label>单价</label><input type="text" id="unitPrice" value="12.5" placeholder="12.5"></div>
                <div class="input-field"><label>总价</label><input type="text" id="totalPrice" value="18750" placeholder="18750"></div>
                <div class="input-field"><label>币制</label><select id="currency"><option value="USD" selected>USD</option><option value="EUR">EUR</option><option value="CNY">CNY</option></select></div>
            </div>
        </div>

        <div style="display: flex; gap: 16px; margin-top: 20px;">
            <div class="input-field" style="flex:2"><label><i class="fas fa-tag"></i> 标记唛码/集装箱号</label><input type="text" id="marks" value="SUNRISE / LA / C/NO.1-320" placeholder="唛头"></div>
            <div class="input-field" style="flex:1"><label>随附单证编号</label><input type="text" id="docNo" placeholder="B240408999"></div>
            <div class="input-field" style="flex:1"><label>境内货源地</label><input type="text" id="originPlace" value="苏州" placeholder="苏州"></div>
        </div>

        <div class="action-bar">
            <button class="btn-secondary" id="resetDefaultBtn"><i class="fas fa-undo-alt"></i> 恢复示例</button>
            <button class="btn-generate" id="generateBtn"><i class="fas fa-file-export"></i> 生成报关单</button>
        </div>
    </div>

    <!-- 预览区带右下角打印按钮 -->
    <div class="preview-wrapper">
        <div class="declaration-card" id="declarationPreview"></div>
        <button class="print-corner-btn" id="printPdfBtn"><i class="fas fa-print"></i> 打印/导出PDF</button>
    </div>
    <div class="footer-note"><i class="far fa-check-circle"></i> 参数驱动 · 数据实时映射 · 符合海关出口格式</div>
</div>

<script>
    (function(){
        const previewContainer = document.getElementById('declarationPreview');
        const fields = {
            consignor: document.getElementById('consignor'), consignee: document.getElementById('consignee'),
            manufacturer: document.getElementById('manufacturer'), contractNo: document.getElementById('contractNo'),
            transportMode: document.getElementById('transportMode'), vesselVoyage: document.getElementById('vesselVoyage'),
            billNo: document.getElementById('billNo'), supervisionMode: document.getElementById('supervisionMode'),
            exemptionNature: document.getElementById('exemptionNature'), licenseNo: document.getElementById('licenseNo'),
            tradeCountry: document.getElementById('tradeCountry'), destinationCountry: document.getElementById('destinationCountry'),
            portOfDestination: document.getElementById('portOfDestination'), portOfExit: document.getElementById('portOfExit'),
            tradeTerm: document.getElementById('tradeTerm'), packageQty: document.getElementById('packageQty'),
            grossWeight: document.getElementById('grossWeight'), netWeight: document.getElementById('netWeight'),
            packageType: document.getElementById('packageType'), freight: document.getElementById('freight'),
            insurance: document.getElementById('insurance'), hsCode: document.getElementById('hsCode'),
            goodsDesc: document.getElementById('goodsDesc'), quantity: document.getElementById('quantity'),
            unit: document.getElementById('unit'), unitPrice: document.getElementById('unitPrice'),
            totalPrice: document.getElementById('totalPrice'), currency: document.getElementById('currency'),
            marks: document.getElementById('marks'), docNo: document.getElementById('docNo'),
            originPlace: document.getElementById('originPlace')
        };

        function getVal(id) { return document.getElementById(id)?.value || ''; }

        function renderDeclaration() {
            const now = new Date();
            const dateStr = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            const data = {

        function parseTxtAndFill(content) {
            const lines = content.split(/\r?\n/);
            const mapping = {
                '境内发货人':'consignor','境外收货人':'consignee','生产销售单位':'manufacturer','合同协议号':'contractNo','运输方式':'transportMode','运输工具名称':'vesselVoyage','提运单号':'billNo','监管方式':'supervisionMode','征免性质':'exemptionNature','许可证号':'licenseNo','贸易国':'tradeCountry','运抵国':'destinationCountry','指运港':'portOfDestination','离境口岸':'portOfExit','成交方式':'tradeTerm','件数':'packageQty','毛重':'grossWeight','净重':'netWeight','包装种类':'packageType','运费':'freight','保费':'insurance','HS编码':'hsCode','商品名称':'goodsDesc','数量':'quantity','单位':'unit','单价':'unitPrice','总价':'totalPrice','币制':'currency','标记唛码':'marks','随附单证':'docNo','境内货源地':'originPlace','合同号':'contractNo','发票号':'contractNo'
            };
            lines.forEach(line => {
                let [key, val] = line.split(/[=：:]\s*/);
                if (!key || val === undefined) return;
                key = key.trim(); val = val.trim();
                const fieldId = mapping[key];
                if (fieldId && fields[fieldId]) {
                    if (fields[fieldId].tagName === 'SELECT') {
                        const option = Array.from(fields[fieldId].options).find(opt => opt.value === val || opt.text === val);
                        if(option) fields[fieldId].value = option.value;
                    } else { fields[fieldId].value = val; }
                }
                if (key.includes('运输工具') && fields.vesselVoyage) fields.vesselVoyage.value = val;
            });
            renderDeclaration();
        }
